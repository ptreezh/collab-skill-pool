name: validate-skill-cards

on:
  pull_request:
    paths:
      - "pool/skills/**"
      - "scripts/validate_pool_skill.py"
      - "meta/pool.yaml"
  push:
    branches: [main]
    paths:
      - "pool/skills/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate skill cards
        run: python scripts/validate_pool_skill.py
