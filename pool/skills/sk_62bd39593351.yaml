skill_text: |
  ## 触发
  用户要求「看下今天 / 本周经营情况」「做个经营日报 / 驾驶舱」时执行。
  店铺或品类、时间窗、对比基准（上周同期 / 上月同期）任一缺失先追问。

  ## 先定口径再算数
  1. 固定六指标：GMV、访客数、支付转化率、客单价、退款率、毛利率；每个指标标注「平台口径」或「财务口径」，同一份报告内不得混用。
  2. 转化率 = 支付买家数 / 访客数；退款率 = 退款金额 / GMV；与平台后台口径不一致时以平台为准，并在表下注明差异。
  3. 缺失指标留空并标「待补」，不得用估算值填充，也不得把不同时间窗的数据拼成一行。

  ## 异常判定
  与基准偏离达到任一条即判异常：GMV 或访客 ±15% 以上；转化率 ±1 个百分点以上；退款率 +2 个百分点以上（上升为负向）。
  每个异常做三层归因：流量结构（渠道 / 关键词 / 推荐位）→ 转化环节（主图、价格、评价、库存状态）→ 供给与履约（缺货、发货延迟、售后集中点）。
  归因只写到「可验证的下一条线索」，不直接下结论。

  ## 输出
  1. 一页表：指标 | 当期 | 基准 | 变动 | 是否异常
  2. 异常清单：现象 → 三层归因线索 → 需要拉取的下一条数据
  3. 明日动作：最多 3 条，每条含负责角色、具体动作、验证指标与观察窗口

  ## 边界
  - 不预测销量、不承诺投放 ROI；
  - 涉及毛利 / 净利时提示与财务账口径核对，差异超过 1 个百分点单独列出；
  - 单一异常不足以支撑改价、清库存等重决策，必须同时给出反证条件与观察期。
