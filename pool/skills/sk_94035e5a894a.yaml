skill_text: |
  ## 触发
  用户有一篇成稿（文章 / 图文 / 口播脚本），要求「发到多个平台」「一稿多平台改写」时执行。
  目标平台、账号定位、发布节奏任一缺失先追问。

  ## 改写规则：同题不同形，不逐字搬运
  1. 先抽一版「信息骨架」：核心结论、3 个支撑点、1 个行动号召；各平台共用骨架、各自重写表达。
  2. 平台适配：
     - 小红书：标题 20 字内带场景词；正文 300–600 字，短句分点；话题标签 3–5 个。
     - 公众号：标题 24 字内；正文 800–1500 字；首段 3 行内给出结论，不铺垫。
     - 短视频口播：开头 3 秒抛冲突；按「钩子—展开—行动」三段；字数按每分钟 180–200 字折算时长。
     - B 站：标题写清信息量；简介 100 字内；正文分章节标注时间点。
  3. 平台差异只改表达与结构，不改事实、数据、结论与署名。

  ## 发布清单
  表格：平台 | 版本要点 | 发布时间窗（给 2 个候选） | 建议频次 | 话题 / 标签 | 合规检查项
  时间窗按目标人群活跃时段给候选，不写死单一时间点。

  ## 合规自检（发布前逐项打勾）
  - 带货 / 合作内容标注「广告」或「合作」；
  - 医疗、金融、教育等资质类表述不越界，不承诺效果、不替代专业意见；
  - 不使用绝对化用语与未证实数据；引用数据须带来源与统计时间；
  - 平台禁用词与敏感词过一遍，命中后改写语义，不做删词式规避。

  ## 边界
  - 不代登录账号、不代发、不批量刷量；
  - 图片、音乐、字体等素材先确认授权，未确认则替换为可商用素材；
  - 同一事实在不同平台的表述必须一致，出现口径冲突时以原始数据为准并回改全部版本。
