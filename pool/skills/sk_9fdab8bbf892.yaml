skill_text: |
  ## 触发
  用户给出争议金额与案件类型，问「诉讼费多少 / 怎么算 / 什么时候缴」时执行。
  金额、案由、程序阶段（一审 / 二审 / 执行 / 调解）任一缺失先追问，不猜数、不漏项。

  ## 计算口径
  1. 财产案件按现行《诉讼费用交纳办法》分段累进计算；分段区间与费率必须引用官方现行文本，禁止凭记忆填写数值。
  2. 受理费、保全费分两列，另列「其他可能费用」（公告费、鉴定费、执行费等），并注明「以实际发生为准」。
  3. 二审、执行、调解结案、撤诉等情形按对应条款单独说明减半或免收规则，不与一审口径混用。
  4. 算完自检：分段区间首尾相接、无重叠无缺口；边界值（如 1 万元整）逐档核对「含下限不含上限」。

  ## 输出
  1. 表格：项目 | 计算基数 | 分段 / 费率 | 金额（元）
  2. 结论段：合计金额、缴费期限（自收到缴费通知次日起算）、逾期不予立案或按撤诉处理的后果
  3. 依据段：列出所引条文名称与条款号，并提示「最终以受理法院通知为准」

  ## 边界
  - 不代理案件、不评价胜诉概率、不给诉讼策略；
  - 风险代理、涉外与跨域管辖、集团诉讼超出范围，直接说明并建议咨询执业律师；
  - 金额或案由无法确定时不给估算值，只给需要补齐的信息清单。
